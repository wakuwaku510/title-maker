<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>版画の題名メーカー</title><style>body{margin:0;background:#f7f5ef;color:#24313a;font-family:system-ui,'Noto Sans JP',sans-serif}main{max-width:760px;margin:25px auto;padding:24px}h1{font-size:clamp(26px,6vw,40px);margin-bottom:8px}.lead{line-height:1.8}.panel{background:white;border:2px solid #25323b;border-radius:20px;padding:24px;box-shadow:7px 7px 0 #d7e2dc}.fields{display:grid;grid-template-columns:1fr 1fr;gap:16px}label{display:block;font-weight:700;margin-bottom:8px}select,input{width:100%;box-sizing:border-box;font:inherit;padding:12px;border:2px solid #b6c3c5;border-radius:10px;background:white}#result{font-size:clamp(25px,5vw,38px);font-weight:800;text-align:center;min-height:90px;display:grid;place-items:center;overflow-wrap:anywhere;margin:24px 0;background:#edf4f0;border-radius:14px;padding:12px}button{font:inherit;font-weight:700;border:0;border-radius:12px;padding:12px 18px;cursor:pointer;background:#264c50;color:white}.buttons{display:flex;flex-wrap:wrap;gap:10px}.secondary{background:#e5e9e8;color:#25323b}.edit{margin-top:22px}.note{font-size:14px;line-height:1.8;color:#526169;margin-top:18px}@media(max-width:520px){.fields{grid-template-columns:1fr}main{padding:15px}.panel{padding:17px}}</style></head><body><main><h1>版画の題名メーカー</h1><p class="lead">自分の版画をじっくり見て、ぴったりの言葉をさがそう！<br>言葉をえらんで、組み合わせをためしてみよう。</p><div class="panel"><div class="fields"><div><label for="motion">① 様子・動き</label><select id="motion"></select></div><div><label for="world">② 世界・もの</label><select id="world"></select></div></div><div id="result" aria-live="polite"></div><div class="buttons"><button id="shuffle">↻ シャッフル</button><button class="secondary" id="copy">題名をコピー</button></div><div class="edit"><label for="custom">③ 自分の言葉で仕上げよう</label><input id="custom" placeholder="ここに自分だけの題名を書こう"></div><div class="buttons" style="margin-top:12px"><button id="copyCustom" class="secondary">自分の題名をコピー</button></div><p class="note">ヒント：言葉をたしたり、順番をかえたりしてもOK！ いちばん大切なのは、自分の作品に合っていることだよ。</p><p id="status" role="status"></p></div></main><script>const motions=['ぐるぐる','くねくね','ぐにゃぐにゃ','ぎざぎざ','しましま','なみなみ','うねうね','でこぼこ','びっしり','ぎっしり','ふしぎな','へんてこな','にぎやかな','わくわく','ドキドキ','はじける','とびだす','広がる','つながる','交わる','重なる','おどる','かけめぐる','うずまく','流れる','ひびき合う','ぶつかる','集まる','まざり合う','生まれる','変身する','あふれだす'];const worlds=['宇宙','銀河','星空','迷路','迷宮','トンネル','王国','お城','街','都市','ジャングル','森','海','深海','宝島','秘密基地','遊園地','ワンダーランド','パラダイス','異世界','未来','夢の国','不思議の国','星','宝石','パズル','モザイク','万華鏡','花火','音楽','リズム','ダンス','ハーモニー','メロディー','交差点','道','扉','鍵','地図','宝箱','夢','冒険','物語','お祭り','パーティー'];const a=document.getElementById('motion'),b=document.getElementById('world'),r=document.getElementById('result'),c=document.getElementById('custom'),s=document.getElementById('status');for(const [el,arr] of [[a,motions],[b,worlds]])arr.forEach(v=>el.add(new Option(v,v)));a.value='ふしぎな';b.value='宇宙';function title(){return a.value+(a.value.endsWith('な')?'':' ')+b.value}function update(){r.textContent=title();s.textContent=''}a.onchange=b.onchange=update;document.getElementById('shuffle').onclick=()=>{a.selectedIndex=Math.floor(Math.random()*a.length);b.selectedIndex=Math.floor(Math.random()*b.length);update()};async function copy(t){try{await navigator.clipboard.writeText(t);s.textContent='コピーしたよ！'}catch(e){s.textContent='コピーできない場合は、文字を選んでコピーしてね。'}}document.getElementById('copy').onclick=()=>copy(title());document.getElementById('copyCustom').onclick=()=>{if(!c.value.trim()){s.textContent='自分の題名を入力してね。';return}copy(c.value.trim())};update();</script></body></html>
